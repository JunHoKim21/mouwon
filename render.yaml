services:
  - type: web
    name: myoyuwon-cat-onsen
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_GA_MEASUREMENT_ID
        value: G-84QYJ7JSZW
